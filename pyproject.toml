[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "DisTunnel"
version = "0.1.0"
dependencies = [
    "scipy>=1.13.1",
    "shapely>=2.0.7",
    "pydfnworks>=2.9.6",
    "pandas>=2.3.3",
    "opencv-python>=4.13.0.92",
    "numpy>=2.0.2",
    "meshio>=5.3.5"]
requires-python = ">=3.9.25"
authors = [{name="Rufus Bloomfield", email = "rufus.bloomfield@aalto.fi"}]
description = "A Python package for converting 3D point clouds to discrete fracture networks"
keywords = ["Rock Engineering", "Discrete Fracture Network", "Fracture", "point cloud", "DFN", "Bedrock Engineering", "Tunnel"]